    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('PWA ServiceWorker registado com sucesso! Âmbito: ', registration.scope);
            },
            (err) => {
              console.log('PWA ServiceWorker falhou ao registar: ', err);
            }
          );
        });
      }
    </script>
